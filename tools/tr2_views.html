<canvas id=out></canvas>
<script type=module>
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search), list = await (await fetch(q.get('list'))).json();
const TW = +q.get('tw') || 220, TH = +q.get('th') || 190, LAB = 18;

    if (it.pose !== undefined && g.animations.length) { const mx = new THREE.AnimationMixer(o); mx.clipAction(g.animations[0]).play(); mx.setTime(it.pose); }
    const w = new THREE.Group(); w.add(o); if (it.ry) w.rotation.y = it.ry * Math.PI / 180; sc.add(w); w.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(w), sz = b.getSize(new THREE.Vector3()), ct = b.getCenter(new THREE.Vector3()), rad = Math.max(sz.x, sz.y, sz.z) * 0.5 * 1.05 + 1e-6;
    info.size = [sz.x, sz.y, sz.z].map(v => +v.toFixed(3)); info.ymin = +b.min.y.toFixed(3);

    }

window.__done = true;
</script>
