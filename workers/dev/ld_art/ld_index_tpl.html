<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>Blue Wall</title>
<link rel="preload" href="/pub/cinzel-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/pub/baskerville-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Vazirmatn;src:url(/pub/Vazirmatn-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/pub/Vazirmatn-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(/pub/Vazirmatn-Black.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Libre Baskerville";src:url(/pub/baskerville-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Libre Baskerville";src:url(/pub/baskerville-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Cinzel;src:url(/pub/cinzel-900.woff2) format("woff2");font-weight:900;font-display:block}
@font-face{font-family:"BW Naskh";src:url(/pub/naskh-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"BW Naskh";src:url(/pub/naskh-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Noto Sans Tai Viet";src:url(/pub/taiviet.woff2) format("woff2");font-display:swap}
:root{--bg:#050912;--ink:#dbe8ff;--dim:#7f93b8;--blue:#4aa8ff;--glow:#7cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
/* ================= loader: a moonlit night over the Blue Wall (all motion = compositor-only CSS transforms / opacity) ================= */
#bw-load{position:fixed;inset:0;z-index:1000;overflow:hidden;contain:strict;transition:opacity .7s ease;
  background:linear-gradient(180deg,#01040b 0%,#030a1b 22%,#081a3b 46%,#123266 62%,#1d4a85 71%,#0d2142 80%,#050b17 90%,#02050b 100%)}
#bw-load.done{opacity:0;pointer-events:none}
/* taste alternative B (?look=B or LOOK default): blue hour, an ice-cyan afterglow behind the peaks; same plates, lifted */
#bw-load.look-b{background:linear-gradient(180deg,#030a1a 0%,#0a1f47 20%,#17407c 32%,#3f78b8 40%,#a9d2f2 46%,#5f93c9 52%,#183a6c 64%,#08142a 82%,#02050b 100%)}
#bw-load.look-b.land{background:linear-gradient(180deg,#071a3d 0%,#1d4d8c 14%,#8cbfe8 24%,#3d72b0 34%,#0b1d3c 70%,#02050b 100%)}
.look-b #ld-rays{opacity:.4}.look-b #ld-stars{opacity:.45}.look-b #ld-far{filter:brightness(1.22) saturate(1.1)}.look-b #ld-near{filter:brightness(1.1) saturate(1.06)}.look-b #ld-vig{opacity:.7}
#bw-load div,#bw-load img,#bw-load svg,#bw-load i{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
#bw-load img{opacity:0;transition:opacity .9s ease}#bw-load img.on{opacity:1}
.ld-paused,.ld-paused *{animation-play-state:paused!important}
/* stars: three box-shadow fields twinkling out of phase */
#ld-stars{left:0;top:0;width:100%;height:62%;overflow:hidden}
#ld-stars i{left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent;will-change:opacity}
#ld-stars .s1{animation:ldTw 3.3s ease-in-out infinite alternate}
#ld-stars .s2{animation:ldTw 4.7s ease-in-out -2s infinite alternate}
#ld-stars .s3{animation:ldTw 2.1s ease-in-out -1s infinite alternate}
@keyframes ldTw{from{opacity:1}to{opacity:.25}}
/* moon */
#ld-halo{border-radius:50%;background:radial-gradient(closest-side,rgba(190,215,255,.34),rgba(110,160,240,.16) 32%,rgba(60,110,220,.06) 62%,rgba(30,60,140,0));will-change:opacity;animation:ldBreath 7s ease-in-out infinite alternate}
#ld-moon{border-radius:50%;background:radial-gradient(circle at 36% 34%,#fdfeff 0,#eef4ff 26%,#d3e0f4 58%,#a9bfe0 88%,#93acd6 100%);
  box-shadow:0 0 6px 1px rgba(235,245,255,.9),0 0 26px 6px rgba(170,205,255,.55),0 0 70px 22px rgba(90,140,240,.25)}
#ld-moon:after{content:"";position:absolute;inset:0;border-radius:50%;opacity:.5;
  background:radial-gradient(ellipse 22% 16% at 60% 38%,rgba(110,130,170,.5),rgba(110,130,170,0)),radial-gradient(ellipse 26% 20% at 42% 62%,rgba(110,130,170,.42),rgba(110,130,170,0)),radial-gradient(ellipse 14% 18% at 31% 44%,rgba(120,140,180,.32),rgba(120,140,180,0)),radial-gradient(ellipse 12% 9% at 68% 66%,rgba(120,140,180,.28),rgba(120,140,180,0)),radial-gradient(circle at 30% 28%,rgba(255,255,255,0) 52%,rgba(50,70,120,.38) 100%)}
@keyframes ldBreath{from{opacity:.82}to{opacity:1}}
/* god rays falling from the moon toward the wall */
#ld-rays{width:0;height:0}
#ld-rays b{left:0;top:0;width:0;height:0;position:absolute;will-change:opacity;animation:ldRay var(--d) ease-in-out var(--dl) infinite alternate}
#ld-rays i{left:0;top:0;height:var(--h);width:var(--l);margin-top:calc(var(--h) / -2);transform-origin:0 50%;transform:rotate(var(--a));
  background:linear-gradient(90deg,rgba(170,205,255,0) 0,rgba(170,205,255,var(--o)) 9%,rgba(120,170,255,calc(var(--o) * .45)) 45%,rgba(90,140,255,0) 100%);
  -webkit-mask-image:linear-gradient(0deg,transparent,#000 42%,#000 58%,transparent);mask-image:linear-gradient(0deg,transparent,#000 42%,#000 58%,transparent)}
@keyframes ldRay{from{opacity:.35}to{opacity:1}}
/* cloud & mist strips: a tileable texture sliding sideways forever */
.ld-strip{left:0;width:calc(100% + var(--tw));background-repeat:repeat-x;background-size:var(--tw) 100%;will-change:transform;animation:ldSlide var(--d) linear infinite}
@keyframes ldSlide{from{transform:translateX(0)}to{transform:translateX(calc(var(--tw) * -1))}}
.ld-strip.rev{animation-direction:reverse}
/* the world frame: plates + everything pinned onto them (positions in % of the plate) */
#ld-world{left:0;top:0;transform-origin:0 0}
#ld-world img{left:0;top:0;width:100%;height:100%}
#ld-far{will-change:transform;transform-origin:50% 70%;animation:ldKen 38s ease-in-out infinite alternate}
@keyframes ldKen{from{transform:scale(1) translateX(0)}to{transform:scale(1.035) translateX(-.8%)}}
#ld-emis{clip-path:ellipse(4% 3% at var(--gx) var(--gy));transition:clip-path .8s ease-out,opacity .9s ease}
.ld-t{width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,236,190,.95),rgba(255,170,80,.55) 22%,rgba(255,120,40,.18) 55%,rgba(255,100,30,0))}
.ld-tg{left:0;top:0;width:100%;height:100%;will-change:opacity;animation:ldFl var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes ldFl{0%{opacity:.6}22%{opacity:1}41%{opacity:.74}63%{opacity:.95}80%{opacity:.68}100%{opacity:.9}}
.ld-em{width:.35em;height:.35em;margin:-.17em 0 0 -.17em;border-radius:50%;background:radial-gradient(closest-side,#fff3c4,#ffb050 50%,rgba(255,120,40,0));opacity:0;will-change:transform,opacity;animation:ldEm var(--d) ease-out var(--dl) infinite}
@keyframes ldEm{0%{opacity:0;transform:translate(0,0) scale(1)}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),-9em) scale(.4)}}
.ld-gate{border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,120,.5),rgba(255,140,60,.2) 45%,rgba(255,120,40,0));will-change:opacity;animation:ldBreath 2.8s ease-in-out infinite alternate}
.ld-fl{transform-origin:0 0;width:var(--w);height:calc(var(--w) * .5)}
.ld-fl svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;transform-origin:0 18%;will-change:transform;animation:ldWave var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes ldWave{0%{transform:skewY(-7deg) scaleX(.9)}50%{transform:skewY(2deg) scaleX(1)}100%{transform:skewY(7deg) scaleX(.94)}}
#ld-drake{width:7%;will-change:transform,opacity;animation:ldDrake 34s linear 5s infinite;opacity:0}
#ld-drake img{position:relative;width:100%;height:auto;opacity:.8;filter:none}
@keyframes ldDrake{0%{transform:translate(-30%,0) rotate(8deg) scale(.7);opacity:0}4%{opacity:.85}38%{transform:translate(620%,-140%) rotate(-4deg) scale(.55);opacity:.8}46%{opacity:0;transform:translate(800%,-190%) rotate(-6deg) scale(.5)}100%{opacity:0;transform:translate(800%,-190%) scale(.5)}}
/* snow: two tiled sheets falling at different speeds, with a slow sway */
#ld-snow{left:0;top:0;width:100%;height:100%;overflow:hidden}
#ld-snow i{left:-10%;width:120%;top:calc(var(--t) * -1);height:calc(100% + var(--t));background-size:var(--t) var(--t);will-change:transform;animation:ldFall var(--d) linear infinite;opacity:var(--o)}
@keyframes ldFall{from{transform:translateY(0)}to{transform:translateY(var(--t))}}
#ld-snow b{position:absolute;inset:0;will-change:transform;animation:ldSway 7s ease-in-out infinite alternate}
@keyframes ldSway{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
#ld-shade{left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(2,5,12,0),rgba(2,5,12,.55) 45%,rgba(1,3,8,.9))}
#ld-vig{inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,2,8,.62) 100%)}
/* ---- top group: dragon over the crown over the title */
#ld-top,#ld-bot{left:0;top:0;transform-origin:0 0}
#ld-dragon{will-change:transform;animation:ldDrift 11s ease-in-out infinite alternate}
@keyframes ldDrift{0%{transform:translate(-7px,4px) rotate(-2.2deg)}50%{transform:translate(2px,-3px) rotate(.6deg)}100%{transform:translate(7px,2px) rotate(2.4deg)}}
#ld-dragon .dw{left:0;top:0;width:100%;height:100%;perspective:520px;will-change:transform;animation:ldBob 2.6s ease-in-out infinite}
@keyframes ldBob{0%,100%{transform:translateY(2px)}38%{transform:translateY(-7px)}}
#ld-dragon img{left:0;top:0;width:100%;height:100%}
#ld-dragon .dl{clip-path:polygon(0 0,42.4% 0,42.4% 29%,44.2% 47%,0 47%);transform-origin:42% 30%;will-change:transform;animation:ldWingL 2.6s cubic-bezier(.45,0,.4,1) infinite}
#ld-dragon .dr{clip-path:polygon(57.6% 0,100% 0,100% 47%,55.8% 47%,57.6% 29%);transform-origin:58% 30%;will-change:transform;animation:ldWingR 2.6s cubic-bezier(.45,0,.4,1) infinite}
#ld-dragon .db{clip-path:polygon(41.6% 0,58.4% 0,58.4% 29%,56.6% 47%,57% 100%,43% 100%,43.4% 47%,41.6% 29%)}
@keyframes ldWingL{0%,100%{transform:rotateY(-24deg)}38%{transform:rotateY(46deg)}}
@keyframes ldWingR{0%,100%{transform:rotateY(24deg)}38%{transform:rotateY(-46deg)}}
#ld-crown .ch{border-radius:50%;background:radial-gradient(closest-side,rgba(150,205,255,.42),rgba(80,150,255,.16) 45%,rgba(40,100,230,0));will-change:opacity;animation:ldBreath 4.5s ease-in-out infinite alternate}
#ld-crown .cr,#ld-spk{left:0;top:0;width:100%;height:100%}
#ld-crown .cg{left:0;top:0;width:100%;height:100%;overflow:hidden;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
#ld-crown .cg i{left:-40%;top:-10%;width:34%;height:120%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(235,248,255,.75) 50%,rgba(255,255,255,0));transform:translateX(0) skewX(-18deg);will-change:transform;animation:ldGlint 5.5s ease-in-out 1.2s infinite}
@keyframes ldGlint{0%{transform:translateX(0) skewX(-18deg)}38%,100%{transform:translateX(560%) skewX(-18deg)}}
.ld-sp{width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);opacity:0;will-change:transform,opacity;animation:ldSpark var(--d) ease-in-out var(--dl) infinite}
.ld-sp:before,.ld-sp:after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(190,230,255,.8) 30%,rgba(120,190,255,0))}
.ld-sp:before{width:100%;height:12%;margin:-6% 0 0 -50%}.ld-sp:after{width:12%;height:100%;margin:-50% 0 0 -6%}
@keyframes ldSpark{0%,58%,100%{opacity:0;transform:scale(.2) rotate(0)}70%{opacity:1;transform:scale(1) rotate(25deg)}84%{opacity:0;transform:scale(.4) rotate(45deg)}}
#ld-title{overflow:visible}
#ld-tsw{overflow:hidden;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
#ld-tsw i{left:-30%;top:0;width:18%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9) 50%,rgba(255,255,255,0));transform:skewX(-18deg);will-change:transform;animation:ldTsw 6.5s ease-in-out 2.4s infinite}
@keyframes ldTsw{0%{transform:translateX(0) skewX(-18deg)}30%,100%{transform:translateX(900%) skewX(-18deg)}}
/* ---- bottom group: forged steel progress bar */
.ld-lab{left:0;right:0;top:0;height:18px;font:900 10.5px/18px Cinzel,serif;letter-spacing:4.2px;color:#9cc9f2;text-shadow:0 0 8px rgba(40,120,255,.7),0 1px 0 #000}
.ld-lab b{position:absolute;right:0;top:-3px;font:900 17px/22px Cinzel,serif;letter-spacing:.5px;color:#f2fbff;text-shadow:0 0 10px rgba(80,180,255,.95),0 1px 0 #000}#bw-load .ld-lab b i{position:static;display:inline;font-size:11px;font-style:normal;margin-left:1px}
.ld-frame{left:0;right:0;top:24px;height:16px;border-radius:8px;padding:2px;
  background:linear-gradient(180deg,#e9f1fb 0,#9fb0c8 22%,#55647d 48%,#2a3446 54%,#6c7d96 78%,#b9c7da 100%);
  box-shadow:0 0 0 1px rgba(3,8,18,.9),0 2px 6px rgba(0,0,0,.8),0 0 18px rgba(40,130,255,.28)}
.ld-chan{position:relative!important;width:100%;height:100%;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#01040c,#071331 70%,#0b1c44);box-shadow:inset 0 2px 4px rgba(0,0,0,.95)}
.ld-fill{left:0;top:0;bottom:0;width:0;border-radius:6px;transition:width .35s ease-out;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 45%,rgba(0,10,40,.25) 100%),linear-gradient(90deg,#0a3192 0,#1660e0 45%,#3aa0ff 82%,#bfeaff 100%);
  box-shadow:0 0 10px rgba(70,170,255,.85)}
.ld-fill i{left:0;top:0;width:200%;height:100%;background:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 14px,rgba(220,245,255,.16) 14px 22px);will-change:transform;animation:ldFlow 1.6s linear infinite}
@keyframes ldFlow{from{transform:translateX(-36px)}to{transform:translateX(0)}}
.ld-spk{top:32px;left:0;width:44px;height:44px;margin:-22px 0 0 -22px;transition:left .35s ease-out}
.ld-spk:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(170,225,255,.85) 22%,rgba(60,160,255,.25) 55%,rgba(40,120,255,0));animation:ldPulse 1.3s ease-in-out infinite alternate;will-change:transform,opacity}
.ld-spk:after{content:"";position:absolute;left:0;top:50%;width:100%;height:1.5px;margin-top:-.75px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0))}
@keyframes ldPulse{from{transform:scale(.7);opacity:.75}to{transform:scale(1);opacity:1}}
.ld-cap{top:22px;width:22px;height:20px;overflow:visible}.ld-cap.l{left:-15px}.ld-cap.r{right:-15px;transform:scaleX(-1)}
.ld-tip{left:-20px;right:-20px;top:56px;text-align:center;font:400 12px/1.35 'Libre Baskerville',Georgia,serif;letter-spacing:.9px;color:#a8c4e6;text-shadow:0 1px 0 #000,0 0 10px rgba(0,0,0,.95)}
#msg{display:none;position:fixed;left:0;right:0;bottom:12%;z-index:1100;text-align:center;padding:0 24px;line-height:1.9;font-size:17px;color:var(--ink);font-weight:700;direction:rtl;text-shadow:0 2px 0 #000,0 0 12px #000}
#msg.big{display:block}
@media (prefers-reduced-motion:reduce){#bw-load *{animation-duration:1ms!important;animation-iteration-count:1!important}#bw-load .ld-tg{animation:ldFl 3.5s ease-in-out infinite alternate!important}#bw-load .ld-strip{animation:none!important}#ld-drake{display:none!important}}
</style>

<body>
<div id="game"></div>
<div id="bw-load"></div>
<div id="msg"></div>
<script>
// ===================================== Blue Wall loading screen (visuals only; hooks: bwLoading(p) / bwTip(t) / bwLoadingDone())
(function () {
const q = new URLSearchParams(location.search); const P0 = q.has('p') ? +q.get('p') : 0;   // ?p=NN previews a fixed percentage
const LOOK = q.get('look') || 'A';   // taste switch: 'A' moonlit night (default) | 'B' blue hour (ice-cyan afterglow behind the peaks)
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const TP = __TP__;
const M = /*LD_META*/{}/*LD_END*/;
const root = document.getElementById('bw-load');
const f1 = (x) => (+x).toFixed(1), f2 = (x) => (+x).toFixed(2);
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
// ---------------------------------------------------------------- layout tables (design px). P = portrait (390 wide), L = landscape (844 wide)
const LAY = {
  P: { tw: 390, th: 380, moon: [112, 82, 31], dragon: [195, 102, 238], crown: [195, 230, 158], title: [195, 330, 274], div: 366, bw: 296, bh: 96 },
  L: { tw: 844, th: 196, moon: [150, 64, 27], dragon: [168, 84, 176], crown: [422, 58, 104], title: [422, 140, 252], div: 172, bw: 380, bh: 92 },
};
// ---------------------------------------------------------------- pieces
const starField = (n, w, h, rmin, rmax, cols) => { const a = []; for (let i = 0; i < n; i++) { const r = rmin + Math.pow(rnd(), 2.2) * (rmax - rmin); a.push(`${Math.round(rnd() * w)}px ${Math.round(rnd() * h * (0.25 + 0.75 * rnd()))}px ${f1(r * 1.6)}px ${f1(r * .45)}px ${cols[i % cols.length]}`); } return a.join(','); };
const rays = () => { const g = ['', '']; [[24, 900, 70, .10], [38, 1100, 120, .09], [52, 1200, 80, .11], [64, 1000, 150, .07], [78, 900, 60, .08], [45, 1300, 30, .14]].forEach(([a, l, h, o], i) => { g[i % 2] += `<i style="--a:${a}deg;--l:${l}px;--h:${h}px;--o:${o}"></i>`; }); return `<b style="--d:9s;--dl:0s">${g[0]}</b><b style="--d:13s;--dl:-5s">${g[1]}</b>`; };
function titleSvg(w) {
  const t = TP.bask, s = w / (t.x1 - t.x0), h = (t.y1 - t.y0) * s, pad = 26;
  const tf = `translate(${f1(pad - t.x0 * s)} ${f1(pad - t.y0 * s)}) scale(${s.toFixed(5)})`, ns = 'vector-effect="non-scaling-stroke"';
  const svg = `<svg id="ld-title" width="${f1(w + pad * 2)}" height="${f1(h + pad * 2)}" viewBox="0 0 ${f1(w + pad * 2)} ${f1(h + pad * 2)}"><defs>
   <filter id="ldb9" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="9"/></filter><filter id="ldb3" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
   <linearGradient id="ldtf" x1="0" y1="${f1(pad)}" x2="0" y2="${f1(pad + h)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#e6f5ff"/><stop offset=".52" stop-color="#a6d8ff"/><stop offset=".6" stop-color="#cfeaff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
   <path id="ldtp" d="${t.d}"/></defs>
   <g transform="${tf}" stroke-linejoin="round"><use href="#ldtp" fill="none" stroke="#1556ff" stroke-width="22" filter="url(#ldb9)" opacity=".8" ${ns}/>
   <use href="#ldtp" fill="none" stroke="#40b8ff" stroke-width="6" filter="url(#ldb3)" opacity=".85" ${ns}/>
   <use href="#ldtp" fill="#061433" stroke="#061433" stroke-width="3.2" transform="translate(0 ${f1(2.2 / s)})" ${ns}/>
   <use href="#ldtp" fill="url(#ldtf)" stroke="#d6f0ff" stroke-width="1.1" ${ns}/></g></svg>`;
  const mask = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${f1(w)} ${f1(h)}'><path transform='translate(${f1(-t.x0 * s)} ${f1(-t.y0 * s)}) scale(${s.toFixed(5)})' d='${t.d}'/></svg>`)}")`;
  return { svg, w, h, pad, mask };
