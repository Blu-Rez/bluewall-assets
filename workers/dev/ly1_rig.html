<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#050912;overflow:hidden}#game{position:fixed;inset:0}</style></head>
<body><div id="game"></div><script>window.BW_ASSETS="/assets/";</script><script src="/rig/wall.js"></script>
<script>
const q = new URLSearchParams(location.search);
window.__log=[]; window.onerror=(m)=>window.__log.push(String(m));
const uid = q.get('uid') || '101';
BlueWall.start({root:document.getElementById('game'), dev:true, token:uid, uid:+uid, owner: uid==='101', name:"Rig "+uid, level:+(q.get('lv')||0), lateTimeout:1e9, welcomeAuto:0.1,
  quality:q.get('q')||'low', hour:q.get('h')!=null?+q.get('h'):13, weather:q.get('w')||'clear',
  progress:(p,t)=>window.__log.push('p '+p.toFixed(0)+' '+(t||'')), ready:()=>{window.__ready=true}}).catch(e=>{window.__log.push('ERR '+e.stack)});
</script></body></html>
